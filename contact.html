<style>

    /* =========================
       BASIC SETTINGS
    ========================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    html {
        scroll-behavior: smooth;
    }


    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #F5F7F2;
        color: #222222;
    }


    /* =========================
       NAVIGATION BAR
    ========================= */

    nav {
        width: 100%;
        height: 70px;
        background: #355E3B;

        display: flex;
        align-items: center;

        padding: 0 14px;

        position: fixed;

        top: 0;
        left: 0;

        z-index: 1000;
    }


    nav ul {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: space-between;

        list-style: none;
    }


    nav ul li a {
        display: block;

        color: white;

        text-decoration: none;

        font-size: 17px;

        font-weight: bold;

        padding: 13px 16px;

        border-radius: 7px;

        transition: 0.3s;
    }


    nav ul li a.active {
        background: #274C32;

        box-shadow:
            0 0 8px rgba(0, 0, 0, 0.45),
            0 0 18px rgba(0, 0, 0, 0.30);
    }


    nav ul li a:hover {
        background: #274C32;

        box-shadow:
            0 0 10px rgba(0, 0, 0, 0.30);
    }


    /* =========================
       CONTACT SECTION
    ========================= */

    .contact {
        min-height: calc(100vh - 90px);

        padding-top: 150px;

        display: flex;

        flex-direction: column;

        align-items: center;

        text-align: center;
    }


    /* =========================
       CONTACT TITLE
    ========================= */

    .contact h1 {
        color: #355E3B;

        font-size: 40px;

        font-weight: bold;

        margin-bottom: 15px;
    }


    /* =========================
       GREEN UNDERLINE
    ========================= */

    .line {
        width: 85px;

        height: 5px;

        background: #527A5A;

        border-radius: 5px;

        margin-bottom: 50px;
    }


    /* =========================
       EMAIL
    ========================= */

    .email {
        font-size: 22px;

        margin-bottom: 18px;
    }


    .email strong {
        color: #222222;
    }


    .email a {
        color: #355E3B;

        text-decoration: none;

        transition: 0.3s;
    }


    .email a:hover {
        color: #527A5A;

        text-decoration: underline;
    }


    /* =========================
       SOCIAL ICONS
    ========================= */

    .social-icons {
        display: flex;

        justify-content: center;

        align-items: center;

        gap: 35px;

        margin-top: 5px;
    }


    .social-icons a {
        color: #355E3B;

        font-size: 34px;

        text-decoration: none;

        transition: 0.3s;
    }


    .social-icons a:hover {
        color: #527A5A;

        transform: translateY(-4px);
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        height: 90px;

        background: #26352A;

        color: white;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 17px;
    }


    /* =========================
       MOBILE RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

        nav {
            height: auto;

            padding: 10px;
        }


        nav ul {
            flex-wrap: wrap;

            justify-content: center;

            gap: 4px;
        }


        nav ul li a {
            font-size: 14px;

            padding: 9px 11px;
        }


        .contact {
            padding-top: 160px;

            padding-left: 15px;

            padding-right: 15px;
        }


        .contact h1 {
            font-size: 30px;
        }


        .email {
            font-size: 17px;

            line-height: 1.8;
        }


        .social-icons {
            gap: 25px;
        }


        .social-icons a {
            font-size: 30px;
        }

    }

</style>
